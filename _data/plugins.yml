# Liste des plugins — alimente l'accueil, la navigation et la recherche.
#
# Pour ajouter un plugin : créer le dossier <id>/fr_FR/ (index.md + changelog.md)
# et son icône dans <id>/images/, puis ajouter une entrée ici.
#
# « langs » liste les langues dans lesquelles la documentation du plugin existe
# réellement. Tant qu'une langue n'y figure pas, les cartes et le sélecteur de
# langue renvoient vers la version française plutôt que vers une page absente.
#
# Le bloc « i18n » ne traduit que le texte de présentation affiché sur
# l'accueil ; il est facultatif, la version française sert de repli.

- id: verisure
  name: Verisure
  tagline: Sécurité
  icon: verisure_icon.png
  marketId: 3997
  langs: [fr_FR, en_US, es_ES, de_DE, it_IT, pt_PT]
  tags: ["Jeedom 4.4+", "Debian 11 / 12", "Homebridge"]
  description: >-
    Interagissez avec votre alarme Verisure comme depuis l'application officielle
    « My Verisure » : détail de l'installation, journal d'activité, activation
    (total, jour, nuit, extérieur), désactivation et demande d'images.
    Compatible avec le plugin Homebridge pour un pilotage depuis l'app Maison d'Apple et Siri.
  i18n:
    en_US:
      name: Verisure
      tagline: Security
      description: >-
        Control your Verisure alarm just like the official “My Verisure” app:
        installation details, activity log, arming (total, day, night, perimeter),
        disarming and image requests. Works with the Homebridge plugin for control
        from Apple's Home app and Siri.
    de_DE:
      name: Verisure
      tagline: Sicherheit
      description: >-
        Steuern Sie Ihre Verisure-Alarmanlage wie mit der offiziellen App
        „My Verisure“: Anlagendetails, Aktivitätsprotokoll, Scharfschaltung
        (total, Tag, Nacht, Außenbereich), Unscharfschaltung und Bildabruf.
        Kompatibel mit dem Homebridge-Plugin für die Bedienung über Apple Home und Siri.
    es_ES:
      name: Verisure
      tagline: Seguridad
      description: >-
        Controla tu alarma Verisure igual que desde la aplicación oficial
        «My Verisure»: detalle de la instalación, registro de actividad, activación
        (total, día, noche, exterior), desactivación y solicitud de imágenes.
        Compatible con el plugin Homebridge para el control desde la app Casa de Apple y Siri.
    it_IT:
      name: Verisure
      tagline: Sicurezza
      description: >-
        Gestisci il tuo allarme Verisure come dall'app ufficiale «My Verisure»:
        dettaglio dell'impianto, registro attività, attivazione (totale, giorno,
        notte, perimetrale), disattivazione e richiesta immagini. Compatibile con
        il plugin Homebridge per il controllo da app Casa di Apple e Siri.
    pt_PT:
      name: Verisure
      tagline: Segurança
      description: >-
        Controle o seu alarme Verisure tal como na aplicação oficial
        «My Verisure»: detalhe da instalação, registo de atividade, ativação
        (total, dia, noite, exterior), desativação e pedido de imagens.
        Compatível com o plugin Homebridge para controlo a partir da app Casa da Apple e da Siri.

- id: myBMW
