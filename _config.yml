# --- Site ---
title: "Documentation des plugins et widgets de Xav-74"
description: "Documentation, guides de configuration et changelogs des plugins et widgets créés par Xav-74 pour la solution domotique Jeedom."
author: "Xav-74"
lang: fr_FR
langs: [fr_FR]          # ajouter en_US ici réactive le sélecteur de langue

baseurl: "/Documentation"   # chemin du projet sur GitHub Pages
url: "https://xav-74.github.io"

# --- Build ---
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
plugins:
  - jekyll-seo-tag
exclude:
  - vendor
  - Gemfile
  - Gemfile.lock
  - README.md
  - transifex.yml

# --- Liens Jeedom ---
community: https://community.jeedom.com
market: https://market.jeedom.com
blog: https://blog.jeedom.com
doc: https://doc.jeedom.com
plugin: "https://market.jeedom.com/index.php?v=d&p=market_display&id="
github_repo: https://github.com/Xav-74/

# --- Divers ---
img: "images"
image: https://doc.jeedom.com/images/logo.png
social:
  name: Jeedom
  links:
    - https://github.com/Xav-74
