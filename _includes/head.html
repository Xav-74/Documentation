<meta charset="utf-8">
<script>/* thème mémorisé, appliqué avant l'affichage pour éviter le clignotement */
(function(){try{if(localStorage.getItem('theme')==='light'){document.documentElement.setAttribute('data-theme','light');}}catch(e){}})();</script>
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0c1118">
<meta name="color-scheme" content="dark">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ t.brand_title }} Xav-74</title>
<meta name="description" content="{{ page.description | default: t.home_subheading }}">
<link rel="icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/images/apple-touch-icon.png' | relative_url }}">
{% if page.layout == 'home' %}
  {% for l in site.langs %}
    {% if l == 'fr_FR' %}{% assign lhref = '/' %}{% else %}{% assign lhref = '/' | append: l | append: '/' %}{% endif %}
<link rel="alternate" hreflang="{{ site.data.i18n[l].html_lang }}" href="{{ lhref | absolute_url }}">
  {% endfor %}
<link rel="alternate" hreflang="x-default" href="{{ '/' | absolute_url }}">
{% endif %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/theme.css' | relative_url }}">
