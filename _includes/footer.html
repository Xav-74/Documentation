<footer class="footer">
  <div class="footer__in">
    <div>© {{ site.time | date: "%Y" }} Xav-74 — Documentation des plugins Jeedom</div>
    <nav>
      <a href="{{ '/' | relative_url }}">Accueil</a>
      <a href="{{ site.github_repo }}" target="_blank" rel="noopener">Dépôt GitHub</a>
      <a href="{{ site.community }}" target="_blank" rel="noopener">Community Jeedom</a>
      <a href="{{ site.market }}" target="_blank" rel="noopener">Market</a>
      <a href="{{ site.doc }}" target="_blank" rel="noopener">Doc Jeedom</a>
    </nav>
  </div>
</footer>

<!-- Recherche -->
<div class="overlay" id="search-overlay" role="dialog" aria-label="Recherche">
  <div class="searchbox">
    <input id="search-input" type="search" autocomplete="off" spellcheck="false"
           placeholder="Rechercher dans la documentation…" aria-label="Rechercher">
    <ul class="results" id="search-results"></ul>
  </div>
</div>

<!-- Agrandissement des images -->
<div class="lightbox" id="lightbox"><img src="" alt=""></div>

<button class="totop" id="totop" type="button" aria-label="Haut de page">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

<script>
window.SEARCH_PAGES = [
  {% assign sp = site.pages | where_exp: "p", "p.pluginId" %}
  {% for p in sp %}
    {% assign pl = site.data.plugins | where: "id", p.pluginId | first %}
    {
      "url": {{ p.url | relative_url | jsonify }},
      "title": {{ p.title | jsonify }},
      "plugin": {{ pl.name | default: p.pluginId | jsonify }},
      "kind": {% if p.url contains 'changelog' %}"Changelog"{% else %}"Documentation"{% endif %}
    }{% unless forloop.last %},{% endunless %}
  {% endfor %}
];
</script>
<script src="{{ '/assets/js/doc.js' | relative_url }}" defer></script>
