<header class="topbar">
  {% if page.layout == 'default' %}
  <button class="iconbtn" id="burger" type="button" aria-label="{{ t.menu_open }}">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  {% endif %}

  <a class="topbar__brand" href="{{ home_url | relative_url }}">
    <svg class="brandmark" viewBox="347.20 320.05 573.45 573.45" role="img" aria-label="Jeedom"><path fill="currentColor" fill-rule="evenodd" d="M479.69,518.75c0,16.03-13.04,29.07-29.07,29.07s-29.07-13.04-29.07-29.07,13.04-29.07,29.07-29.07,29.07,13.04,29.07,29.07ZM744.57,736.79h87.22v58.15h-87.22v-58.15ZM657.35,836.9c0,8.92-7.23,16.15-16.15,16.15h-203.51c-8.92,0-16.15-7.23-16.15-16.15v-25.84c0-8.92,7.23-16.15,16.15-16.15h203.51c8.92,0,16.15,7.23,16.15,16.15v25.84ZM657.35,749.71c0,8.92-7.23,16.15-16.15,16.15h-203.51c-8.92,0-16.15-7.23-16.15-16.15v-25.84c0-8.92,7.23-16.15,16.15-16.15h203.51c8.92,0,16.15,7.23,16.15,16.15v25.84ZM889.93,836.93c0,8.92-7.23,16.15-16.15,16.15h-171.21c-8.92,0-16.15-7.23-16.15-16.15v-142.13c0-8.92,7.23-16.15,16.15-16.15h129.21v-146.11c0-5.47-2.77-10.56-7.35-13.54l-99.48-83.56c-5.68-3.69-13.07-3.45-18.49.62l-42.66,31.99c-4.07,3.05-6.46,7.84-6.46,12.92v181.52c0,8.92-7.23,16.15-16.15,16.15h-203.51c-8.92,0-16.15-7.23-16.15-16.15v-77.12c-25.67-11.22-43.61-36.82-43.61-66.63,0-40.14,32.54-72.68,72.68-72.68s72.68,32.54,72.68,72.68c0,29.8-17.94,55.41-43.61,66.63v27.86h119.52v-161.33c0-5.08,2.39-9.87,6.46-12.92l100.37-75.28c5.63-4.22,13.35-4.31,19.08-.22l158.05,133.66c4.24,3.03,6.76,7.93,6.76,13.14v326.65Z"/></svg>
    <span>
      <b>{{ t.brand_title }}</b>
      <small>{{ t.brand_subtitle }}</small>
    </span>
  </a>

  <div class="topbar__spacer"></div>

  <button class="searchbtn" id="search-open" type="button" aria-label="{{ t.search_button }}">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <span>{{ t.search_button }}</span>
    <kbd>Ctrl K</kbd>
  </button>

  <button class="themebtn" id="theme-toggle" type="button" title="{{ t.theme }}" aria-label="{{ t.theme }}" aria-pressed="false">
    <svg class="ico-soleil" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="ico-lune" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>

  {% if site.langs.size >= 2 %}{% include lang-menu.html %}{% endif %}

  <nav class="topbar__nav">
    <a href="{{ home_url | relative_url }}">{{ t.nav_home }}</a>
    <a class="opt" href="{{ site.github_repo }}" target="_blank" rel="noopener">{{ t.nav_github }}</a>
    <a class="opt" href="{{ site.community }}" target="_blank" rel="noopener">{{ t.nav_community }}</a>
    <a class="opt" href="{{ site.market }}" target="_blank" rel="noopener">{{ t.nav_market }}</a>
    <a class="opt" href="{{ site.doc }}" target="_blank" rel="noopener">{{ t.nav_doc }}</a>
  </nav>
</header>
